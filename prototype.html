<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shubham Pack App</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
background:#e9eef2;
font-family: 'Segoe UI', sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

/* MOBILE FRAME */

.mobile-frame{
width:360px;
height:740px;
background:white;
border-radius:40px;
box-shadow:0 20px 60px rgba(0,0,0,0.25);
overflow:hidden;
position:relative;
}

/* STATUS BAR */

.status-bar{
height:28px;
background:#ffffff;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 12px;
font-size:12px;
color:#333;
}

/* APP SCREEN */

.screen{
padding:30px;
}

/* LOGO */

.logo{
text-align:center;
margin-top:40px;
}

.logo img{
width:160px;
}

/* LOGIN FORM */

.login-title{
text-align:center;
margin-top:15px;
font-weight:600;
color:#444;
}

.input-group{
margin-top:25px;
}

.input-group label{
font-size:13px;
color:#666;
}

.input-group input{
width:100%;
padding:12px;
border-radius:8px;
border:1px solid #ddd;
margin-top:6px;
font-size:14px;
}

/* BUTTON */

.login-btn{
margin-top:30px;
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#2c7db7;
color:white;
font-size:16px;
font-weight:600;
cursor:pointer;
}

.login-btn:hover{
background:#23699b;
}

/* FORGOT PASSWORD */

.forgot{
text-align:center;
margin-top:18px;
font-size:13px;
}

.forgot a{
color:#2c7db7;
text-decoration:none;
font-weight:500;
}

.footer{
position:absolute;
bottom:20px;
width:100%;
text-align:center;
font-size:12px;
color:#888;
}

</style>
</head>

<body>

<div class="mobile-frame">

<div class="status-bar">
<span>9:41</span>
<span>
<i class="fa fa-signal"></i>
<i class="fa fa-wifi"></i>
<i class="fa fa-battery-three-quarters"></i>
</span>
</div>

<div class="screen">

<div class="logo">
<img src="https://shubhampack.com/wp-content/uploads/2021/05/Logo.png" alt="Shubham Pack">
</div>

<div class="login-title">
Login to Continue
</div>

<div class="input-group">
<label>Mobile Number</label>
<input type="text" placeholder="Enter mobile number">
</div>

<div class="input-group">
<label>Password</label>
<input type="password" placeholder="Enter password">
</div>

<button class="login-btn">
Login
</button>

<div class="forgot">
<a href="#">Forgot Password?</a>
</div>

</div>

<div class="footer">
Shubham Pack © 2026
</div>

</div>

</body>
</html>
