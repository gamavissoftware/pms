<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">

<style>

body{
margin:0;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#1c1c1c;
font-family:'Manrope',sans-serif;
}

/* PHONE FRAME */

.phone{
width:360px;
height:720px;
background:black;
border-radius:36px;
overflow:hidden;
position:relative;
box-shadow:0 30px 60px rgba(0,0,0,0.5);
}

/* HOME SCREEN */

.home{
height:100%;
background:url("https://images.unsplash.com/photo-1519681393784-d120267933ba") center/cover;
}

/* STATUS BAR */

.statusbar{
position:absolute;
top:0;
left:0;
right:0;
height:30px;
display:flex;
justify-content:space-between;
padding:6px 12px;
color:white;
font-size:12px;
}

/* TIME */

.time{
font-weight:600;
}

/* ICONS */

.icons{
display:flex;
gap:6px;
}

/* NOTIFICATION */

.notification{
position:absolute;
top:40px;
left:10px;
right:10px;
background:white;
border-radius:14px;
padding:12px;
display:flex;
gap:10px;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
animation:slideDown .5s ease;
}

.notif-icon{
width:40px;
height:40px;
background:#2c7db7;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-size:18px;
}

.notif-content{
flex:1;
}

.notif-app{
font-size:11px;
font-weight:700;
color:#555;
}

.notif-title{
font-size:13px;
font-weight:700;
}

.notif-text{
font-size:12px;
color:#666;
margin-top:2px;
}

.notif-time{
font-size:11px;
color:#999;
}

/* ANIMATION */

@keyframes slideDown{
from{
opacity:0;
transform:translateY(-20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>
</head>

<body>

<div class="phone">

<div class="home">

<!-- STATUS BAR -->

<div class="statusbar">

<div class="time">09:41</div>

<div class="icons">
📶 🔋
</div>

</div>

<!-- PUSH NOTIFICATION -->

<div class="notification">

<div class="notif-icon">
🔔
</div>

<div class="notif-content">

<div class="notif-app">
Shubham Pack
</div>

<div class="notif-title">
New Task Assigned
</div>

<div class="notif-text">
DF 1720 requires your approval
</div>

</div>

<div class="notif-time">
now
</div>

</div>

</div>

</div>

</body>
</html>
