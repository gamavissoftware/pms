<!DOCTYPE html>
<html>
<head>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Inter',sans-serif;
background:#f4f7fb;
}

/* HEADER */

.header{
background:linear-gradient(135deg,#2c7db7,#4fa4e0);
height:210px;
display:flex;
align-items:center;
justify-content:center;
border-bottom-left-radius:30px;
border-bottom-right-radius:30px;
}

.logo img{
width:170px;
}

/* LOGIN CARD */

.login-card{
background:white;
margin:-60px 18px 0 18px;
border-radius:18px;
padding:22px;
box-shadow:0 15px 30px rgba(0,0,0,0.08);
}

.login-title{
font-size:18px;
font-weight:600;
margin-bottom:4px;
}

.login-sub{
font-size:12px;
color:#6b7280;
margin-bottom:18px;
}

/* INPUT */

.input-group{
margin-bottom:16px;
}

.input-label{
font-size:12px;
color:#6b7280;
margin-bottom:6px;
}

.input-box{
display:flex;
align-items:center;
background:#f6f8fc;
border-radius:10px;
padding:10px 12px;
}

.input-box i{
color:#9ca3af;
margin-right:8px;
font-size:14px;
}

.input-box input{
border:none;
background:none;
outline:none;
width:100%;
font-size:14px;
}

/* BUTTON */

.login-btn{
margin-top:10px;
width:100%;
padding:14px;
background:#2c7db7;
border:none;
border-radius:12px;
color:white;
font-size:15px;
font-weight:500;
cursor:pointer;
box-shadow:0 8px 16px rgba(44,125,183,0.35);
}

/* FORGOT */

.forgot{
text-align:center;
margin-top:14px;
font-size:12px;
}

.forgot a{
color:#2c7db7;
text-decoration:none;
}

/* FOOTER */

.footer{
text-align:center;
margin-top:35px;
font-size:11px;
color:#9ca3af;
}

/* NAV BUTTON */

.nav-btn{
position:fixed;
bottom:22px;
right:22px;
background:#2c7db7;
width:52px;
height:52px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-size:20px;
box-shadow:0 10px 20px rgba(0,0,0,0.2);
cursor:pointer;
}

</style>
</head>

<body>

<div class="header">
<div class="logo">
<img src="https://shubhampack.com/wp-content/uploads/2021/05/Logo.png">
</div>
</div>

<div class="login-card">

<div class="login-title">
Welcome Back
</div>

<div class="login-sub">
Login to continue to Shubham Pack CRM
</div>

<div class="input-group">

<div class="input-label">
Mobile Number
</div>

<div class="input-box">
<i class="fa fa-phone"></i>
<input type="text" placeholder="Enter mobile number">
</div>

</div>

<div class="input-group">

<div class="input-label">
Password
</div>

<div class="input-box">
<i class="fa fa-lock"></i>
<input type="password" placeholder="Enter password">
</div>

</div>

<button class="login-btn">
Login
</button>

<div class="forgot">
<a href="#">Forgot Password?</a>
</div>

</div>

<div class="footer">
Shubham Pack © 2026
</div>


<div class="nav-btn" onclick="goNext()">
<i class="fa fa-arrow-right"></i>
</div>

<script>

function goNext(){
parent.document.getElementById("appFrame").src="dashboard.html";
}

</script>

</body>
</html>
