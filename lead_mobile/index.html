<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Form</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>
        .mobile-form {
            background-color: whitesmoke;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid lightgray;
            margin: 20px 0px;
        }

        .mobile-form h1 {
            color: #17a2b8;
            font-size: 20px;
            text-align: center;
            margin: 8px 0px;
            font-weight: 700;
        }

        .mobile-form label {
            font-size: 14px;
        }

        .mobile-form select {
            width: 100%;
            border: 1px solid lightgray;
            border-radius: 2px;
            padding: 5px 10px;
            font-size: 14px;
            outline: #17a2b8;
            -webkit-appearance: none;
        }

        .mobile-form textarea {
            width: 100%;
            border: 1px solid lightgray;
            border-radius: 2px;
            padding: 5px 10px;
            font-size: 14px;
            outline: #17a2b8;
            -webkit-appearance: none;
        }

        .mobile-form input {
            width: 100%;
            border: 1px solid lightgray;
            border-radius: 2px;
            padding: 5px 10px;
            font-size: 14px;
            outline: #17a2b8;
            -webkit-appearance: none;
        }

        @media (max-width:576px) {
            .mobile-form input {
                font-size: 12px;
            }

            .mobile-form label {
                font-size: 12px;
            }

            .mobile-form select {
                font-size: 12px;
            }

            .mobile-form textarea {
                font-size: 12px;
            }

            .btn {
                margin-top: 29px !important;
                padding: 5px 10px !important;
                font-size: 12px !important;
            }

            .mobile-form img{
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container ">
        <div class="mobile-form">
            <div class="row">
                <div class="col-sm-4 col-5">
                    <div class="text-center">
                        <img src="hpcl_logo.png">
                    </div>
                </div>
                <div class="col-sm-8 col-7">
                    <h1>ADD NEW LEAD</h1>
                </div>
            </div>
            <hr>
            <form action="">
                <div class="row">
                    <div class="col-sm-6">
                        <div class="form-group">
                            <label for="field-1" class="control-label">Create Date</label>
                            <span style="color:red;">*</span>
                            <span id="error_create_date" style="color:red;"></span>
                            <input type="text" id="create_date" name="create_date" value="" autocomplete="off">
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <div class="form-group">
                            <label for="field-1" class="control-label">Lead Source</label>
                            <span style="color:red;">*</span>
                            <span id="error_lead_source" style="color:red;"></span>
                            <select class="form-control" id="lead_source" name="lead_source">
                                <option value="">--Select Lead Source--</option>
                                <option value="1"> CALL </option>
                                <option value="2"> Whatsapp </option>
                                <option value="3"> Referral </option>
                            </select>
                        </div>
                    </div>
                    <div class="col-sm-12">
                        <div class="form-group">
                            <label for="field-1" class="control-label">Company Name</label>
                            <input type="text" id="company_name" name="company_name" placeholder="Company Name"
                                autocomplete="off" value="">
                        </div>
                    </div>
                    <div class="col-sm-12">
                        <div class="form-group">
                            <label for="field-1" class="control-label">Nature of Business</label>
                            <select id="patient_type" name="patient_type">
                                <option value="">--Select Customer Type--</option>

                                <option value="1"> Hydrolic Oil </option>


                                <option value="2"> Gear Oil </option>


                            </select>
                        </div>
                    </div>
                    <div class="col-sm-12">
                        <div class="form-group">
                            <label for="field-1" class="control-label">Company Location</label>
                            <select id="company_location" name="company_location" onchange="getProductsOfCompany(0)">
                                <option value="">--Select Company Location--</option>
                                <option value="1"> GKN ENTERPRISES </option>
                                <option value="2"> SATIN ENTERPRISES </option>
                                <option value="3"> M/s. SUNDER INDUSTRIAL OIL </option>
                            </select>
                        </div>
                    </div>
                    <div class="col-sm-12">
                        <div class="row productss">
                            <div class="col-md-5 col-5">
                                <div class="form-group">
                                    <label for="field-1" class="control-label">Competitor Product</label>
                                    <span style="color:red;">*</span>
                                    <input type="text" name="competitor_product[]">
                                </div>
                            </div>
                            <div class="col-md-5 col-5">
                                <div class="form-group">
                                    <label for="field-1" class="control-label">Products</label>
                                    <span style="color:red;">*</span>
                                    <span id="error_product" style="color:red;"></span>
                                    <select class=" product_name0" name="products[]">
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-2 col-2">
                                <a href="javascript:void(0)" class="btn btn-warning btn-xs add_more"
                                    style="    margin-top: 32px;"><i class="fa fa-plus" aria-hidden="true"></i></a>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-12">
                        <div class="form-group">
                            <label for="field-1" class="control-label"> Company Website</label>
                            <input type="web" id="" name="website" placeholder="www.example.com" autocomplete="off">
                        </div>
                    </div>
                    <div class="col-sm-12">
                        <div class="form-group">
                            <label for="field-2" class="control-label">City/Area</label>
                            <input type="text" id="city" name="city" placeholder="City" autocomplete="off" value="">
                        </div>
                    </div>
                    <div class="col-sm-12">
                        <hr>
                        <div class="row">
                            <div class="col-md-4">
                                <div class="form-group">

                                    <label for="field-2" class="control-label">Title</label>

                                    <span style="color:red;">*</span>

                                    <span id="error_title" style="color:red;"></span>

                                    <select name="title" id="title" required="">
                                        <option value="Mr.">Mr.</option>
                                        <option value="Mrs.">Mrs.</option>
                                        <option value="Miss.">Miss.</option>
                                    </select>

                                </div>
                            </div>
                            <div class="col-md-8">
                                <div class="form-group">

                                    <label for="field-2" class="control-label">Customer Name(Decision Maker)</label>

                                    <span style="color:red;">*</span>

                                    <span id="error_cust_name" style="color:red;"></span>

                                    <input type="text" id="cust_name" name="cust_name" placeholder="Customer Name"
                                        value="" autocomplete="off">

                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-12">
                        <div class="row">
                            <div class="col-md-4 col-4">
                                <div class="form-group">
                                    <label for="field-2" class="control-label">Country
                                        Code</label>
                                    <input type="text" name="country_code" value="91" readonly="">
                                </div>
                            </div>
                            <div class="col-md-8 col-8">
                                <div class="form-group">
                                    <label for="field-2" class="control-label">Contact Number</label>
                                    <span style="color:red;">*</span>
                                    <span id="error_mobile_no" style="color:red;"></span>
                                    <input type="text" id="mobile_no" name="mobile_no" class="form-control" value=""
                                        placeholder="Contact No" autocomplete="off">
                                </div>
                            </div>
                            <input class="form-control" name="message1" id="message1" style="overflow:hidden"
                                type="hidden">
                        </div>
                    </div>
                    <div class="col-sm-12">
                        <div class="form-group">

                            <label for="field-2" class="control-label">Email ID</label>

                            <span style="color:red;">*</span>

                            <span id="error_email_id" style="color:red;"></span>

                            <input type="text" id="email_id" name="email_id" placeholder="Email ID" value=""
                                autocomplete="off">

                        </div>
                    </div>
                    <div class="col-sm-12">
                        <div class="form-group">
                            <label for="field-2" class="control-label">Postal Address</label>
                            <textarea name="postal_address" id="postal_address" placeholder="Postal Address"
                                autocomplete="off" style="height:186px;"></textarea>
                        </div>
                    </div>
                    <div class="col-sm-12">
                        <div class="form-group">

                            <label for="field-2" class="control-label">Alternate Contact Details</label>

                            <input type="text" name="alt_contact" id="alt_contact" placeholder="Alternate Contact"
                                autocomplete="off">

                        </div>
                    </div>
                    <div class="col-sm-12">
                        <div class="row">

                            <div class="col-md-4 col-4">

                                <div class="form-group">

                                    <label for="field-2" class="control-label">Country
                                        Code</label>

                                    <input type="text" class=" country_code" name="country_code" id="country_code"
                                        readonly="">

                                </div>

                            </div>

                            <div class="col-md-8 col-8">
                                <div class="form-group">
                                    <label for="field-2" class="control-label">Contact Number</label>
                                    <input type="text" name="alt_contact_no" placeholder="Contact Number"
                                        autocomplete="off">
                                </div>
                            </div>
                            <input name="message1" id="message1" style="overflow:hidden" type="hidden">
                        </div>
                    </div>
                    <div class="col-sm-12">
                        <div class="form-group">

                            <label for="field-2" class="control-label">E-mail</label>

                            <input type="email" name="email" id="email" placeholder="E-mail" autocomplete="off">

                        </div>
                    </div>
                    <div class="col-sm-12">
                        <div class="form-group">

                            <label for="field-2" class="control-label">Remarks (If Any..) </label>


                            <textarea name="spacification" id="spacification" placeholder="Enter Remarks"
                                autocomplete="off" style="height:187px;"></textarea>



                        </div>
                    </div>
                    <div class="col-sm-12">
                        <input type="submit" id="saves_form" class="btn btn-info" value="Submit">
                    </div>
                </div>
            </form>
        </div>
    </div>

</body>

</html>
